<!-- ====== PÁGINA: PERFIL ====== -->
<section id="page-profile" class="page">
  <div class="profile-container">

    <!-- Encabezado de perfil -->
    <div class="profile-header">
      <div class="profile-avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="profile-info">
        <h2 id="profile-name-display">Usuario</h2>
        <p  id="profile-email-display">email@correo.com</p>
        <span class="profile-badge">✦ Cliente Danissa</span>
      </div>
    </div>

    <!-- Formulario editar datos -->
    <div class="profile-section">
      <h3>✦ Mis datos</h3>
      <form id="form-profile">
        <div class="profile-field">
          <div class="field-group">
            <label>Nombre completo</label>
            <input id="profile-name"  type="text" placeholder="Tu nombre" />
          </div>
          <div class="field-group">
            <label>Email</label>
            <input id="profile-email" type="email" disabled style="opacity:0.5;cursor:not-allowed" />
          </div>
        </div>
        <div class="profile-field">
          <div class="field-group">
            <label>Teléfono</label>
            <input id="profile-phone" type="tel" placeholder="Ej: 300 000 0000" />
          </div>
          <div class="field-group">
            <label>Ciudad</label>
            <input id="profile-city" type="text" placeholder="Ej: Medellín" />
          </div>
        </div>
        <button type="submit" class="btn-save">
          <i class="fa-solid fa-floppy-disk"></i> Guardar cambios
        </button>
      </form>
    </div>

    <!-- Cerrar sesión -->
    <div class="profile-section" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h3 style="margin-bottom:0.25rem">✦ Sesión</h3>
        <p style="font-size:0.8rem;color:var(--gray-mid)">Cerrar tu sesión actual</p>
      </div>
      <button id="btn-logout" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
      </button>
    </div>

  </div>
</section><!-- /page-profile -->
