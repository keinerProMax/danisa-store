<!-- ====== PÁGINA: CONTACTO ====== -->
<section id="page-contact" class="page">
  <div class="contact-container">

    <!-- Info de contacto -->
    <div class="contact-info">
      <h2>Contáctanos <span>.</span></h2>
      <p>¿Tienes alguna pregunta sobre nuestros productos o tu pedido? Estamos aquí para ayudarte.</p>

      <div class="contact-detail">
        <div class="contact-detail-icon"><i class="fa-solid fa-location-dot"></i></div>
        <div class="contact-detail-text">
          <label>Dirección</label>
          <span>Medellín, Colombia</span>
        </div>
      </div>

      <div class="contact-detail">
        <div class="contact-detail-icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="contact-detail-text">
          <label>Email</label>
          <span>hola@danissastore.com</span>
        </div>
      </div>

      <div class="contact-detail">
        <div class="contact-detail-icon"><i class="fa-brands fa-whatsapp"></i></div>
        <div class="contact-detail-text">
          <label>WhatsApp</label>
          <span>+57 300 000 0000</span>
        </div>
      </div>

      <div class="contact-detail">
        <div class="contact-detail-icon"><i class="fa-brands fa-instagram"></i></div>
        <div class="contact-detail-text">
          <label>Instagram</label>
          <span>@danissastore</span>
        </div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="contact-form">
      <h3>✦ Envíanos un mensaje</h3>
      <form id="form-contact">
        <div class="form-group">
          <label>Nombre</label>
          <input id="contact-name" type="text" placeholder="Tu nombre completo" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input id="contact-email" type="email" placeholder="tu@correo.com" required />
        </div>
        <div class="form-group">
          <label>Asunto</label>
          <select id="contact-subject" required>
            <option value="">Selecciona un asunto</option>
            <option value="pedido">Consulta sobre pedido</option>
            <option value="producto">Información de producto</option>
            <option value="devolucion">Devolución / Cambio</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mensaje</label>
          <textarea id="contact-message" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>
        <button type="submit" class="btn-send">
          <i class="fa-solid fa-paper-plane"></i>
          Enviar mensaje
        </button>
      </form>
    </div>

  </div>
</section><!-- /page-contact -->
