<!-- ================================================
     MODAL: AUTH (Login / Registro)
     ================================================ -->
<div id="auth-overlay" class="auth-overlay" role="dialog" aria-modal="true">
  <div class="auth-modal">

    <!-- Cerrar -->
    <button id="auth-close" class="auth-close" aria-label="Cerrar">
      <i class="fa-solid fa-xmark"></i>
    </button>

    <!-- Logo -->
    <div class="auth-logo">
      <span class="logo-name">Danissa Store</span>
      <div class="logo-dot" style="margin:4px auto 0"></div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
      <button class="auth-tab"        data-tab="register">Registrarse</button>
    </div>

    <!-- Formulario Login -->
    <form id="form-login" class="auth-form" data-form="login">
      <div class="form-group">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="tu@correo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="login-pass" type="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-auth">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar
      </button>
      <div class="auth-divider">o</div>
      <p style="text-align:center;font-size:0.75rem;color:var(--gray-mid)">
        ¿No tienes cuenta?
        <button type="button" onclick="showAuthTab('register')"
          style="background:none;border:none;color:var(--purple-light);cursor:pointer;font-size:0.75rem;font-weight:700">
          Regístrate aquí
        </button>
      </p>
    </form>

    <!-- Formulario Registro -->
    <form id="form-register" class="auth-form hidden" data-form="register">
      <div class="form-group">
        <label>Nombre completo</label>
        <input id="reg-name" type="text" placeholder="Tu nombre" required autocomplete="name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="tu@correo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input id="reg-confirm" type="password" placeholder="Repite la contraseña" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn-auth">
        <i class="fa-solid fa-user-plus"></i> Crear cuenta
      </button>
    </form>

  </div>
</div>

<!-- Toast -->
<div id="toast"></div>
